    <script>
        let currentLang = 'en';
        let miningInterval = null;
        let minedAmount = 0.0000;
        let poolAmount = 0.0000;
        let currentHashRate = 24.41;

        // Top 20 Most Populous Countries Languages Dictionary
        const dict = {
            en: {
                logo: "Zyler Cloud Miner", network: "Network: BNB Smart Chain (BSC)", walletLabel: "Your BSC Wallet Address (BEP20):", walletPlaceholder: "Paste your 0x... address here", startBtn: "Start Mining", devicePower: "Device Power:", powerModeLabel: "Mining Power Mode:", secureActive: "SECURE MINING ACTIVE", hashRateLabel: "Current Hashrate:", minedLabel: "Live Mined:", poolLabel: "Pool Balance:", stopBtn: "Stop Mining", resetBtn: "Change Wallet / Logout", poolTitle: "Pool & Auto Transfer ($0.50 Target)", usdLabel: "USD Value:", waitingClaim: "Waiting for $0.50 Threshold", readyClaim: "Transfer to Wallet ($0.50 Ready!)", portalBtn: "🌐 Zyler Official Site & Portal", portalTitle: "Zyler Network Vision", portalDesc: "Zyler (ZLR) is a decentralized PoW network optimized for CPU & ARM, turning everyday hardware into massive mining pools with a strict 21 Million supply cap.", quote: "\"Mining is no longer just a monopoly for massive ASIC devices or the wealthy; it's everyone's right on their phone or home computer.\"", tokenDistTitle: "📊 Supply & Token Allocation", maxSupplyLabel: "Total Max Supply:", rewardPoolLabel: "Mining Reward Pool:", teamLabel: "Team Share:", reserveLabel: "Reserve / Ecosystem:", apkBtn: "Download Zyler APK", backMinerBtn: "⛏️ Back to Cloud Miner", footer: "Security & Encryption: Advanced anti-bot & token protection active. © 2026 Zyler"
            },
            tr: {
                logo: "Zyler Cloud Miner", network: "Ağ: BNB Smart Chain (BSC)", walletLabel: "BSC Cüzdan Adresiniz (BEP20):", walletPlaceholder: "0x... adresinizi buraya yapıştırın", startBtn: "Madenciliğe Başla", devicePower: "Cihaz Gücü:", powerModeLabel: "Kazım Gücü Seçimi:", secureActive: "GÜVENLİ KAZIM AKTİF", hashRateLabel: "Anlık Kazım Hızı:", minedLabel: "Canlı Kazılan:", poolLabel: "Havuzda Biriken:", stopBtn: "Durdur (Stop)", resetBtn: "Cüzdanı Değiştir / Çıkış Yap", poolTitle: "Havuz & Otomatik Aktarım ($0.50 Hedef)", usdLabel: "USD Değeri:", waitingClaim: "$0.50 Eşiği Bekleniyor", readyClaim: "Cüzdana Aktar ($0.50 Hazır!)", portalBtn: "🌐 Zyler Resmi Sitesi & Portal", portalTitle: "Zyler Network Vizyonu", portalDesc: "Zyler (ZLR), sıradan donanımları devasa madencilik havuzlarına dönüştüren; CPU ve ARM optimizasyonlu, toplam 21 Milyon arzıyla sınırlı merkeziyetsiz PoW ağıdır.", quote: "\"Madencilik artık sadece devasa ASIC cihazlarının veya zenginlerin monopolünde değil; cebindeki telefonda, evindeki bilgisayarda herkesin hakkı.\"", tokenDistTitle: "📊 Arz ve Token Dağılımı", maxSupplyLabel: "Toplam Maksimum Arz:", rewardPoolLabel: "Madencilik Ödül Havuzu:", teamLabel: "Takım Payı:", reserveLabel: "Rezerv / Ekosistem:", apkBtn: "Zyler APK İndir", backMinerBtn: "⛏️ Cloud Miner Paneline Dön", footer: "Güvenlik & Şifreleme: Gelişmiş anti-bot ve token koruması aktif. © 2026 Zyler"
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = dict[lang] || dict['en'];
            for (const key in t) {
                const el = document.getElementById('t-' + key);
                if (el) {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = t[key];
                    } else {
                        el.innerText = t[key];
                    }
                }
            }
        }

        function switchView(view) {
            document.getElementById('minerSection').classList.remove('active');
            document.getElementById('portalSection').classList.remove('active');
            if (view === 'miner') {
                document.getElementById('minerSection').classList.add('active');
            } else if (view === 'portal') {
                document.getElementById('portalSection').classList.add('active');
            }
        }

        function setMode(percentage, element) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentHashRate = 24.41 * (percentage / 100);
            document.getElementById('hashRate').innerText = currentHashRate.toFixed(2) + " MH/s";
        }

        function addLog(text) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += "<br>" + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function startMining() {
            const wallet = document.getElementById('walletInput').value.trim();
            if (!wallet.startsWith('0x') || wallet.length < 10) {
                alert(currentLang === 'tr' ? 'Lütfen geçerli bir BSC (BEP20) cüzdan adresi giriniz (0x ile başlamalı).' : 'Please enter a valid BSC wallet address starting with 0x.');
                return;
            }
            localStorage.setItem('zyler_wallet', wallet);
            localStorage.setItem('zyler_time', Math.floor(Date.now() / 1000));
            startMiningSession(wallet);
            addLog("[Mining] Wallet connected: " + wallet.substring(0, 6) + "...");
        }

        function startMiningSession(wallet) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';

            if (miningInterval) clearInterval(miningInterval);
            miningInterval = setInterval(() => {
                let increment = (currentHashRate / 100000);
                minedAmount += increment;
                poolAmount += increment;

                localStorage.setItem('zyler_mined', minedAmount);
                localStorage.setItem('zyler_time', Math.floor(Date.now() / 1000));

                document.getElementById('minedZlr').innerText = minedAmount.toFixed(4) + " ZLR";
                document.getElementById('poolZlr').innerText = poolAmount.toFixed(4) + " ZLR";

                let usd = (poolAmount * 0.05);
                let progress = (usd / 0.50) * 100;
                if (progress > 100) progress = 100;
                document.getElementById('usdVal').innerText = "$" + usd.toFixed(2) + " / $0.50";
                document.getElementById('progressBar').style.width = progress + "%";

                const t = dict[currentLang] || dict['en'];
                if (usd >= 0.50) {
                    const claimBtn = document.getElementById('claimBtn');
                    claimBtn.innerText = t.readyClaim;
                    claimBtn.style.background = "#22c55e";
                    claimBtn.style.cursor = "pointer";
                    claimBtn.disabled = false;
                }
            }, 1000);
        }

        function stopMining() {
            if (miningInterval) {
                clearInterval(miningInterval);
                miningInterval = null;
            }
            addLog("[System] Mining stopped.");
        }

        function resetWallet() {
            stopMining();
            localStorage.removeItem('zyler_wallet');
            localStorage.removeItem('zyler_mined');
            localStorage.removeItem('zyler_time');
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('walletInput').value = '';
            minedAmount = 0; 
            poolAmount = 0;
            addLog("[System] Wallet disconnected & data reset.");
        }

        window.onload = function() {
            const savedWallet = localStorage.getItem('zyler_wallet');
            const savedMined = localStorage.getItem('zyler_mined');
            const savedTime = localStorage.getItem('zyler_time');

            if (savedWallet) {
                document.getElementById('walletInput').value = savedWallet;
                if (savedMined) {
                    minedAmount = parseFloat(savedMined);
                    poolAmount = minedAmount;
                }
                if (savedTime) {
                    let now = Math.floor(Date.now() / 1000);
                    let elapsedSeconds = now - parseInt(savedTime);
                    if (elapsedSeconds > 0 && savedMined) {
                        let recoveredMined = parseFloat(savedMined) + (elapsedSeconds * (24.41 / 100000));
                        minedAmount = recoveredMined;
                        poolAmount = recoveredMined;
                    }
                }
                startMiningSession(savedWallet);
                addLog("[Mining] Wallet reconnected: " + savedWallet.substring(0, 6) + "...");
            }
        };
    </script>
